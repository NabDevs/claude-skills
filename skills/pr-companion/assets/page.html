<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR companion</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5f6b7e; --border: #d9dde5;
    --holds: #1a7f37; --nothold: #b42318; --unsure: #8a5d00; --accent: #2457d6; --on-accent: #ffffff;
    --add: #e6f4ea; --del: #fdecea; --code: #f2f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #98a2b3; --border: #2e3644;
      --holds: #4ac26b; --nothold: #f97066; --unsure: #e3b341; --accent: #7aa2ff; --on-accent: #0d1320;
      --add: #12301d; --del: #3a1714; --code: #141920;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; }

  header { position: sticky; top: 0; z-index: 1; padding: 10px 0; border-bottom: 1px solid var(--border); background: var(--card); }
  .top { display: flex; gap: 12px; align-items: baseline; }
  h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn { font-size: 13px; color: var(--muted); text-align: right; }
  .conn::before { content: "●"; margin-right: 6px; }
  .conn.ok::before { color: var(--holds); } .conn.bad { color: var(--nothold); }
  .meta { display: flex; gap: 4px 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .meta b, .activity { color: var(--text); }
  .activity { display: flex; gap: 6px; align-items: center; }

  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 16px 48px; }
  .section { font-size: 13px; color: var(--muted); margin: 12px 0 0; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }

  .card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 10px; }
  .card.holds { border-left-color: var(--holds); } .card.does-not-hold { border-left-color: var(--nothold); } .card.unsure { border-left-color: var(--unsure); }
  .card.fresh { animation: fresh 2.5s ease-out; }
  @keyframes fresh { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }
  summary { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; padding: 10px 14px; cursor: pointer; list-style: none; border-radius: 10px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; color: var(--muted); width: 12px; font-size: 16px; line-height: 1; }
  .card[open] > summary::before { content: "▾"; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; font-weight: 600; white-space: nowrap; }
  .badge.holds { color: var(--holds); } .badge.does-not-hold { color: var(--nothold); } .badge.unsure { color: var(--unsure); }
  .where { font: 13px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; min-width: 0; }
  .author { font-size: 13px; color: var(--muted); }
  .status { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .status.attention { color: var(--text); font-weight: 600; }
  .spin { flex: none; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin, .card.fresh { animation: none; } }

  .body { padding: 0 14px 14px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 4px; }
  .quote { border-left: 3px solid var(--border); padding: 2px 12px; margin: 4px 0 8px; }
  .quote.reply { margin-left: 16px; font-size: 14px; }
  .who { font-size: 13px; color: var(--muted); }
  .who b { color: var(--text); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  code, pre { font: 12.5px/1.5 ui-monospace, Menlo, monospace; background: var(--code); border-radius: 6px; }
  code { padding: 1px 4px; }
  pre { padding: 8px; overflow-x: auto; margin: 4px 0; white-space: pre; }
  pre.diff > span { display: block; width: max-content; min-width: 100%; }
  pre .add { background: var(--add); } pre .del { background: var(--del); }
  .note { padding: 8px 12px; border-radius: 6px; background: var(--code); }
  .note.bad { background: var(--del); } .note.good { background: var(--add); }
  textarea { display: block; width: 100%; min-height: 64px; max-height: 320px; field-sizing: content; resize: vertical; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .steps .now { color: var(--text); font-weight: 600; } .steps .ok { color: var(--holds); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .spacer { margin-left: auto; }
  button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.quiet { border-color: transparent; background: none; color: var(--muted); }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: inherit; text-decoration: underline; }
  button:disabled, textarea:disabled { opacity: .5; cursor: default; }
  .error { color: var(--nothold); font-size: 13px; margin-top: 8px; }
  .question { font-weight: 600; margin-top: 10px; }
  .answer { border-left: 3px solid var(--accent); padding: 2px 12px; margin: 4px 0; }
  .ai { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }
  .waiting { display: flex; gap: 6px; align-items: center; }
  .askrow { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
  .askrow textarea { min-height: 36px; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1 id="title">PR companion</h1>
    <button class="quiet" id="fold" hidden></button>
    <span class="conn" id="conn" role="status">Loading…</span>
  </div>
  <div class="meta" id="meta"></div>
</div></header>
<main class="wrap" id="main"></main>
<script>
'use strict';
const headers = { 'X-Companion-Token': location.hash.slice(1) };
const drafts = {};        // cardId -> { text, base }: the reply the user is editing, and the draft it started from
const pending = {};       // cardId -> { type, snapshot }: the last button press, until the agent changes the card
const armed = {};         // cardId -> the action that waits for a second click
const opened = {};        // cardId -> open or closed, once the user chose
const failed = {};        // cardId -> why the last button press was not sent; 'ask:' + cardId for a question
const asking = {};        // cardId, or PR for the whole pull request -> the question the user is typing
const asked = {};         // same key -> [{ at, question }]: questions sent, until the answer is in the data
const PR = 'pr';
const views = new Map();  // cardId -> { key, node }: an unchanged card keeps its node, with focus and selection
let known = null;         // card ids on the page so far; a later one gets a short highlight
let lastJson = '';
let data = { cards: [] };

const VERDICT = { holds: 'Holds', 'does-not-hold': 'Does not hold', unsure: 'Unclear' };
// One row per card status: its label, the buttons it offers in order, and whether the card is done or Claude is at work.
const STATUS = {
  new: { label: 'Waiting for you', buttons: ['apply', 'reply', 'recheck', 'dismiss'] },
  outdated: { label: 'Fix rewritten after a new commit', buttons: ['apply', 'reply', 'recheck', 'dismiss'] },
  applying: { label: 'Applying the fix…', busy: true },
  applied: { label: 'Fix applied, not committed yet', buttons: ['commit', 'undo'], step: 'commit' },
  'tests-failed': { label: 'Tests fail with the fix', buttons: ['undo'], step: 'undo', attention: true },
  committing: { label: 'Committing and pushing…', busy: true },
  committed: { label: 'Committed and pushed, no reply yet', buttons: ['reply', 'recheck', 'dismiss'], step: 'reply' },
  replied: { label: 'Replied', done: true },
  dismissed: { label: 'Dismissed', done: true },
};
// One row per button. confirm: the label of the second click, for an action that leaves this computer.
const ACTION = {
  apply: { label: 'Apply fix', busy: 'Applying the fix…' },
  undo: { label: 'Undo fix', busy: 'Taking the fix out again…' },
  commit: { label: 'Commit & push', busy: 'Committing and pushing…', confirm: 'Confirm: commit & push' },
  reply: { label: 'Post reply', busy: 'Posting the reply…', confirm: 'Confirm: post on GitHub' },
  recheck: { label: 'Judge again', busy: 'Judging again…', quiet: true },
  dismiss: { label: 'Dismiss', busy: 'Dismissing…', quiet: true },
};
const STEPS = ['apply', 'commit', 'reply'];
const statusOf = (card) => STATUS[card.status] || { label: card.status || '', buttons: ['recheck', 'dismiss'] };
const isDone = (card) => Boolean(statusOf(card).done);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

// A link, or nothing when the address is not an https one.
const link = (url, label) => (/^https:\/\//.test(url || '') ? el('a', { href: url, target: '_blank', rel: 'noopener' }, label) : null);

// Shows `code` and ``` blocks as code. Every piece is still a text node.
function rich(text) {
  const box = el('div', { class: 'text' });
  String(text).split(/```[^\n]*\n([\s\S]*?)```/).forEach((part, i) => {
    if (i % 2) return box.append(el('pre', {}, part.replace(/\n$/, '')));
    part.split(/`([^`\n]+)`/).forEach((piece, j) => box.append(j % 2 ? el('code', {}, piece) : piece));
  });
  return box;
}

function diffView(text) {
  const pre = el('pre', { class: 'diff' });
  for (const line of String(text).split('\n')) {
    const cls = line.startsWith('+') && !line.startsWith('+++') ? 'add'
      : line.startsWith('-') && !line.startsWith('---') ? 'del' : '';
    pre.append(el('span', cls ? { class: cls } : {}, line || ' '));
  }
  return pre;
}

async function sendEvent(card, type) {
  if (ACTION[type].confirm && armed[card.id] !== type) { armed[card.id] = type; return render(); }
  delete armed[card.id];
  delete failed[card.id];
  const body = { type, cardId: card.id, card }; // the card as shown: the server refuses a press on a card that changed
  if (type === 'reply') body.reply = drafts[card.id]?.text ?? card.reply ?? '';
  pending[card.id] = { type, snapshot: JSON.stringify(card) };
  document.activeElement?.blur();
  render();
  let problem = '';
  try {
    const res = await fetch('/event', { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (res.status === 409) problem = 'This card changed after the page showed it. Look at it again, then press once more.';
    else if (!res.ok) problem = `Not sent (error ${res.status}).`;
  } catch {
    problem = 'Not sent: the companion does not answer.';
  }
  if (problem) {
    delete pending[card.id];
    failed[card.id] = problem;
    render();
    poll();
  }
}

async function ask(id) {
  const question = (asking[id] || '').trim();
  if (!question) return;
  delete failed['ask:' + id];
  try {
    const res = await fetch('/event', { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'ask', cardId: id === PR ? null : id, question }) });
    if (!res.ok) throw new Error(res.status);
    (asked[id] ||= []).push({ at: (await res.json()).at, question });
    delete asking[id];
  } catch {
    failed['ask:' + id] = 'Question not sent: the companion does not answer.';
  }
  document.activeElement?.blur();
  render();
  views.get(id)?.node.querySelector('.askrow textarea')?.focus(); // ready for the next question
}

// The questions about one card, or about the whole pull request, and a field for the next one.
function askView(id, answered = []) {
  const box = el('div', {});
  for (const q of [...answered, ...(asked[id] || [])]) {
    box.append(el('div', { class: 'question' }, q.question), q.answer == null
      ? el('div', { class: 'hint waiting' }, el('span', { class: 'spin' }), 'Waiting for Claude…')
      : el('div', { class: 'answer' }, el('span', { class: 'ai' }, 'Claude'), rich(q.answer)));
  }
  const area = el('textarea', { rows: 1, 'aria-label': 'Question for Claude', placeholder: id === PR ? 'For example: what is left before this can merge?' : 'For example: is there a simpler fix?' });
  area.value = asking[id] || '';
  area.addEventListener('input', () => { asking[id] = area.value; });
  area.addEventListener('blur', () => render());
  area.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); ask(id); } });
  box.append(el('div', { class: 'askrow' }, area, el('button', { onclick: () => ask(id) }, 'Ask')));
  if (failed['ask:' + id]) box.append(el('div', { class: 'error', role: 'alert' }, failed['ask:' + id]));
  return box;
}

// The panel for questions about the whole pull request. It opens by itself once it holds a question.
function prAskView() {
  const questions = data.questions || [];
  const total = questions.length + (asked[PR] || []).length;
  const node = el('details', { class: 'card pr' });
  node.open = opened[PR] ?? total > 0;
  node.append(el('summary', { onclick: () => { opened[PR] = !node.open; } },
    el('b', {}, 'Ask Claude about this pull request'), total ? el('span', { class: 'author' }, `${total} asked`) : null));
  node.append(el('div', { class: 'body' }, askView(PR, questions)));
  return node;
}

function cardView(card) {
  const status = statusOf(card);
  const wait = pending[card.id];
  const busy = Boolean(wait) || Boolean(status.busy);
  const hasFix = Boolean(card.proposal?.diff);
  const step = hasFix ? status.step || 'apply' : 'reply'; // the button that brings the card further

  const node = el('details', { class: 'card ' + (card.verdict || '') });
  node.open = opened[card.id] ?? !status.done;
  node.append(el('summary', { onclick: () => { opened[card.id] = !node.open; } },
    card.verdict ? el('span', { class: 'badge ' + card.verdict }, VERDICT[card.verdict] || card.verdict) : null,
    el('span', { class: 'where' }, card.path ? `${card.path}:${card.line ?? '?'}` : 'PR conversation'),
    el('span', { class: 'author' }, card.author || 'unknown'),
    el('span', { class: 'status' + (status.attention ? ' attention' : '') }, busy ? el('span', { class: 'spin' }) : null, wait ? ACTION[wait.type].busy : status.label),
  ));

  const body = el('div', { class: 'body' });
  body.append(el('div', { class: 'quote' },
    el('div', { class: 'who' }, el('b', {}, card.author || 'unknown'), ' wrote · ', link(card.url, 'open on GitHub')),
    rich(card.comment || '')));
  for (const r of card.replies || []) {
    body.append(el('div', { class: 'quote reply' }, el('div', { class: 'who' }, el('b', {}, r.author || 'unknown')), rich(r.body || '')));
  }
  if (card.take) body.append(el('h3', {}, 'Claude’s verdict'), rich(card.take));
  if (card.changes) body.append(el('h3', {}, 'Applied change'), diffView(card.changes));
  else if (hasFix) body.append(el('h3', {}, 'Proposed fix (not applied yet)'), diffView(card.proposal.diff));
  if (card.statusNote) {
    const tone = status.attention ? ' bad' : ['applied', 'committed', 'replied'].includes(card.status) ? ' good' : '';
    body.append(el('h3', {}, 'Result'), el('div', { class: 'note' + tone }, link(card.statusNote, card.statusNote) || rich(card.statusNote)));
  }

  if ((status.buttons || []).includes('reply') && card.reply != null) {
    const draft = drafts[card.id];
    const area = el('textarea', { 'aria-label': 'Draft reply', rows: 3 });
    area.value = draft?.text ?? card.reply;
    area.disabled = busy;
    area.addEventListener('input', () => { drafts[card.id] = { text: area.value, base: draft?.base ?? card.reply }; });
    area.addEventListener('blur', () => render());
    const reset = () => { delete drafts[card.id]; render(); };
    body.append(el('h3', {}, 'Draft reply'), area, el('div', { class: 'hint' },
      draft && draft.base !== card.reply ? 'Claude wrote a new draft; this is still your text. '
        : 'Edit it as you like. Nothing goes to GitHub until you press Post reply. ',
      draft && draft.text !== card.reply ? el('button', { class: 'link', onclick: reset }, 'Back to Claude’s draft') : null));
  }

  if (!status.done) {
    if (hasFix) {
      const at = Math.max(0, STEPS.indexOf(step));
      body.append(el('div', { class: 'steps' }, ...STEPS.flatMap((type, i) => [
        i ? el('span', {}, '›') : null,
        el('span', { class: i < at ? 'ok' : i === at ? 'now' : '' }, `${i < at ? '✓' : i + 1 + '.'} ${ACTION[type].label}`),
      ])));
    }
    const offered = (status.buttons || []).filter((type) => (type !== 'apply' || hasFix) && (type !== 'reply' || card.reply != null));
    const button = (type) => {
      const action = ACTION[type];
      const isArmed = armed[card.id] === type;
      const b = el('button', { class: isArmed || type === step ? 'primary' : action.quiet ? 'quiet' : '', onclick: () => sendEvent(card, type) }, isArmed ? action.confirm : action.label);
      b.disabled = busy;
      return b;
    };
    body.append(el('div', { class: 'actions' },
      ...offered.filter((type) => !ACTION[type].quiet).map(button),
      armed[card.id] ? el('button', { class: 'quiet', onclick: () => { delete armed[card.id]; render(); } }, 'Cancel') : null,
      el('span', { class: 'spacer' }),
      ...offered.filter((type) => ACTION[type].quiet).map(button)));
    if (failed[card.id]) body.append(el('div', { class: 'error', role: 'alert' }, failed[card.id]));
  }
  body.append(el('h3', {}, 'Ask Claude'), askView(card.id, card.questions));
  node.append(body);
  return node;
}

// Returns the node with this id, and builds a new one only when what it shows (the key) has changed.
function keep(id, shown, build) {
  const key = JSON.stringify(shown);
  const old = views.get(id);
  const typing = document.activeElement?.tagName === 'TEXTAREA' && old?.node.contains(document.activeElement);
  if (old && (old.key === key || typing)) return old.node; // never rebuild under the user's cursor; blur renders again
  const node = build();
  views.set(id, { key, node });
  return node;
}

function view(card) {
  const draft = drafts[card.id];
  const shown = [card, pending[card.id]?.type, armed[card.id], failed[card.id], failed['ask:' + card.id], asked[card.id], draft?.base, draft && draft.text !== card.reply];
  return keep(card.id, shown, () => {
    const node = cardView(card);
    if (known && !known.has(card.id)) node.classList.add('fresh');
    return node;
  });
}

function render() {
  const cards = data.cards || [];
  for (const card of cards) {
    // A button press is answered once the agent changes anything on the card.
    if (pending[card.id] && pending[card.id].snapshot !== JSON.stringify(card)) delete pending[card.id];
    if (isDone(card)) delete drafts[card.id];
  }
  // A question that was sent is answered once the data holds an entry with its time.
  for (const [id, sent] of Object.entries(asked)) {
    const answered = (id === PR ? data.questions : cards.find((c) => c.id === id)?.questions) || [];
    asked[id] = sent.filter((q) => !answered.some((a) => a.at === q.at));
  }
  const todo = cards.filter((c) => !isDone(c));
  const done = cards.filter(isDone);
  const pr = data.pr || {};
  const name = pr.number ? `#${pr.number} ${pr.title || ''}` : 'PR companion';
  document.title = (todo.length ? `(${todo.length}) ` : '') + (pr.number ? `PR #${pr.number} · companion` : 'PR companion');
  document.getElementById('title').replaceChildren(link(pr.url, name) || name);
  const count = (verdict) => todo.filter((c) => c.verdict === verdict).length;
  document.getElementById('meta').replaceChildren(
    data.activity ? el('span', { class: 'activity' }, el('span', { class: 'spin' }), `Claude: ${data.activity}`) : '',
    el('span', {}, el('b', {}, String(todo.length)), ' to do'),
    ...Object.keys(VERDICT).filter(count).map((v) => el('span', { class: 'badge ' + v }, `${count(v)} ${VERDICT[v].toLowerCase()}`)),
    el('span', {}, `${done.length} done`),
    pr.repo ? el('span', {}, pr.repo + (pr.headSha ? ` @ ${pr.headSha.slice(0, 7)}` : '')) : '',
    data.updatedAt ? el('span', {}, 'updated ' + new Date(data.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) : '',
  );

  const wanted = [keep(PR, [data.questions, asked[PR], failed['ask:' + PR]], prAskView), ...todo.map(view)];
  if (!todo.length) {
    wanted.push(el('div', { class: 'empty' }, cards.length ? 'Everything is handled. New comments appear here by themselves.'
      : 'No review comments yet. This page updates by itself when one arrives.'));
  }
  if (done.length) wanted.push(el('div', { class: 'section' }, `Done (${done.length})`), ...done.map(view));
  const main = document.getElementById('main');
  const staying = new Set(wanted);
  for (const child of [...main.children]) if (!staying.has(child)) child.remove();
  wanted.forEach((node, i) => { if (main.children[i] !== node) main.insertBefore(node, main.children[i] || null); });
  known = new Set(cards.map((c) => c.id));

  const fold = document.getElementById('fold');
  const anyOpen = todo.some((c) => opened[c.id] ?? true);
  fold.hidden = todo.length < 2;
  fold.textContent = anyOpen ? 'Collapse all' : 'Expand all';
  fold.onclick = () => { for (const c of todo) { opened[c.id] = !anyOpen; views.delete(c.id); } render(); };
}

function setConn(state, text) {
  const conn = document.getElementById('conn');
  conn.className = 'conn ' + state;
  if (conn.textContent !== text) conn.textContent = text;
}

async function poll() {
  try {
    const res = await fetch('/data', { headers });
    if (res.status === 403) return setConn('bad', 'No access: open the link with the token that Claude gave you.');
    const json = await res.text();
    if (json !== lastJson) {
      try { data = JSON.parse(json); } catch { return; } // a half-written file: the next poll reads it again
      lastJson = json;
      for (const id of Object.keys(failed)) delete failed[id]; // a message about an earlier press is over once the data moved on
      render();
    }
    setConn('ok', 'Live');
  } catch {
    setConn('bad', 'Not connected. Start the companion again from Claude; this page then continues by itself.');
  }
}
poll();
setInterval(poll, 2000);
</script>
